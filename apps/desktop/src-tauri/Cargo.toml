[package]
name = "vibe-keyboard-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vibe-keyboard = { path = "../../..", features = ["specta"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"

[dev-dependencies]
# Mock runtime: the commands run through the IPC layer in tests, with no window.
tauri = { version = "2", features = ["test", "tray-icon", "image-png"] }
serde_json = "1"
