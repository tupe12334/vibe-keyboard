name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds apps/desktop/dist at compile time, so build the frontend first.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install linecheck
        run: cargo install linecheck --locked

      - name: Check file length
        run: linecheck .

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Compiles the iTerm2 AppleScripts too, so the runner needs the app bundle.
      - name: Install iTerm2
        run: |
          brew install --cask iterm2
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/iTerm.app
          osascript -e 'id of application id "com.googlecode.iterm2"'

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
