name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml: installs the pinned toolchain with its components and targets.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds apps/desktop/dist at compile time, so build the frontend first.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install linecheck
        run: cargo install linecheck --version 1.2.1 --locked

      - name: Check file length
        run: linecheck .

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Releases are universal. This compiles the Intel slice so an Intel-only break cannot merge.
      - name: Check Intel target
        run: cargo check --workspace --all-targets --locked --target x86_64-apple-darwin

      # Compiles the iTerm2 AppleScripts too, so the runner needs the app bundle.
      - name: Install iTerm2
        run: |
          brew install --cask iterm2
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/iTerm.app
          osascript -e 'id of application id "com.googlecode.iterm2"'

      # Probe for the FULL SCREEN UI test. The TCC.db inserts edit only this ephemeral CI VM's
      # user database, never a developer Mac. Non-blocking: the result is printed for triage.
      - name: Probe iTerm2 Apple events
        continue-on-error: true
        run: |
          defaults write com.googlecode.iterm2 SUEnableAutomaticChecks -bool NO
          defaults write com.googlecode.iterm2 PromptOnQuit -bool NO
          defaults write com.googlecode.iterm2 NoSyncOnboardingWindowHasBeenShown -bool YES
          DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /bin/bash /usr/bin/osascript; do
            for target in com.googlecode.iterm2 com.apple.systemevents; do
              sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags) VALUES ('kTCCServiceAppleEvents','$client',1,2,4,1,0,'$target',0);" || echo "TCC insert failed: $client -> $target"
            done
          done
          perl -e 'alarm shift; exec @ARGV' 30 osascript -e 'tell application id "com.googlecode.iterm2" to get name' || echo "probe exit: $?"

      # VK_UI_TEST opens real iTerm2 windows for the FULL SCREEN test. Local runs skip it.
      - name: Test
        env:
          VK_UI_TEST: "1"
        run: cargo test --workspace --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Coverage gate
        env:
          VK_UI_TEST: "1"
        run: scripts/coverage.sh

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.1

      - name: Unused dependencies
        run: cargo machete

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
