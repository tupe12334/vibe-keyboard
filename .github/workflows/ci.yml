name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # The Tauri crate embeds apps/desktop/dist at compile time, so build the frontend first.
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Install linecheck
        run: cargo install linecheck --version 1.2.1 --locked

      - name: Check file length
        run: linecheck .

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Releases are universal. This compiles the Intel slice so an Intel-only break cannot merge.
      - name: Check Intel target
        run: cargo check --workspace --all-targets --locked --target x86_64-apple-darwin

      - name: Test
        run: cargo test --workspace --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Coverage gate
        run: scripts/coverage.sh

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.1

      - name: Unused dependencies
        run: cargo machete

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
