rules:
  - pattern: "src/domain/navigation.rs"
    error: 157
  - pattern: "src/domain/navigation/movement.rs"
    error: 114
  - pattern: "src/infrastructure/profile_store_tests.rs"
    error: 162
  - pattern: "src/main.rs"
    error: 284
  - pattern: "src/application/pages/centy/issues.rs"
    error: 110
  - pattern: "src/presentation/tui/app_state.rs"
    error: 104
  - pattern: "**/*.rs"
    error: 100
    error_message: "Over 100 lines: split this file. Caps only go down."

  # Non-Rust files: no limit for now.
  - pattern: "**/*"

exclude:
  - "target/**"
  - "node_modules/**"
  - ".claude/**"
