rules:
  - pattern: "src/main.rs"
    error: 284
  - pattern: "src/application/pages/centy/issues.rs"
    error: 110
  - pattern: "src/presentation/tui/app_state.rs"
    error: 104
  - pattern: "**/*.rs"
    error: 100
    error_message: "Over 100 lines: split this file. Caps only go down."

  # Desktop UI: 100 lines per file. Generated bindings.ts is excluded below.
  - pattern: "apps/desktop/src/App.tsx"
    error: 218
  - pattern: "apps/desktop/src/KeyPanel.tsx"
    error: 168
  - pattern: "apps/desktop/src/**/*.ts"
    error: 100
    error_message: "Over 100 lines: split this file. Caps only go down."
  - pattern: "apps/desktop/src/**/*.tsx"
    error: 100
    error_message: "Over 100 lines: split this file. Caps only go down."

  # Non-Rust files: no limit for now.
  - pattern: "**/*"

exclude:
  - "target/**"
  - "node_modules/**"
  - "apps/desktop/src/bindings.ts"
  - ".claude/**"
