rules:
  - pattern: "src/domain/navigation.rs"
    error: 266
  - pattern: "src/domain/profile.rs"
    error: 258
  - pattern: "src/infrastructure/claude_sessions_tests.rs"
    error: 367
  - pattern: "src/application/mod.rs"
    error: 202
  - pattern: "src/infrastructure/profile_store_tests.rs"
    error: 316
  - pattern: "src/main.rs"
    error: 284
  - pattern: "src/infrastructure/images/profile_key.rs"
    error: 194
  - pattern: "src/infrastructure/persistence_tests.rs"
    error: 164
  - pattern: "src/infrastructure/app_icon_tests.rs"
    error: 134
  - pattern: "src/infrastructure/claude_sessions/os.rs"
    error: 147
  - pattern: "src/application/pages/claude_sessions.rs"
    error: 164
  - pattern: "src/application/pages/centy/issues.rs"
    error: 110
  - pattern: "src/presentation/tui/app_state.rs"
    error: 104
  - pattern: "**/*.rs"
    error: 100
